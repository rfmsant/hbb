<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>HBB Revisão — protótipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&family=Libre+Caslon+Text:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#12233F;--gold:#8C6A2F;--goldl:#C2A061;--ivory:#F4EFE6;--paper:#F7F4EE;--slate:#4A5260;--white:#FFFFFF;--line:#E4DED2}
*{box-sizing:border-box;margin:0;padding:0;border-radius:0}
body{font-family:Jost,Arial,sans-serif;background:var(--paper);color:var(--blue);font-size:16px;line-height:26px;-webkit-tap-highlight-color:transparent}
.serif{font-family:"Libre Caslon Text",Georgia,serif}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{background:var(--white);border-bottom:1px solid var(--gold);padding:16px 20px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.mono{width:54px;height:54px;background:var(--blue);color:var(--ivory);font:700 15px/1 "Libre Caslon Text",Georgia,serif;display:flex;align-items:center;justify-content:center;letter-spacing:.5px}
.nm{display:flex;flex-direction:column;align-items:flex-start;gap:7px}
.nm b{font:700 22px/1 "Libre Caslon Text",Georgia,serif;letter-spacing:2px;color:var(--blue)}
.nm i{font:500 7.5px/1 Jost,Arial,sans-serif;font-style:normal;color:var(--gold);white-space:nowrap}
header .ctx{margin-left:auto;text-align:right}
.lbl{font:500 12px/16px Jost,Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.navb{background:none;border:1px solid var(--blue);color:var(--blue);font:500 13px Jost,Arial;padding:6px 10px;cursor:pointer;margin-top:4px}
main{flex:1;padding:24px 20px;display:flex;flex-direction:column;gap:16px}
h1{font:400 28px/34px "Libre Caslon Text",Georgia,serif}
h2{font:400 22px/30px "Libre Caslon Text",Georgia,serif}
.sec{color:var(--slate);font-size:14px;line-height:22px}
.rule{height:1px;background:var(--gold);border:0}
.tile{background:var(--white);border:1px solid var(--line);padding:18px;display:flex;align-items:center;gap:16px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.tile:hover:not([disabled]){border-color:var(--blue)}
.tile[disabled]{opacity:.75}
.tile .lbl{display:block}
.num{width:44px;height:44px;flex:none;border:1px solid var(--blue);display:flex;align-items:center;justify-content:center;font:400 20px "Libre Caslon Text",Georgia,serif}
.num.f{background:var(--blue);color:var(--ivory)}
.tile b{display:block;font-weight:500}
.btn{border:1px solid var(--blue);padding:13px 16px;font:500 15px Jost,Arial,sans-serif;cursor:pointer;width:100%;background:var(--white);color:var(--blue);text-align:center;text-decoration:none;display:block}
.btn.p{background:var(--blue);color:var(--ivory)}
.btn.g{background:var(--gold);border-color:var(--gold);color:var(--white)}
.btn.q{border-color:var(--slate);color:var(--slate)}
.btn:disabled{opacity:.35;cursor:default}
.row{display:flex;gap:10px}.row>*{flex:1}
.bar{height:2px;background:var(--line)}.bar i{display:block;height:100%;background:var(--gold);transition:width .25s}
/* deck */
.deck{position:relative;height:420px}
.sc{position:absolute;inset:0;background:var(--white);border:1px solid var(--line);border-top:2px solid var(--blue);padding:24px;display:flex;flex-direction:column;gap:14px;touch-action:none;user-select:none;cursor:grab;transition:transform .25s ease}
.sc.drag{transition:none;cursor:grabbing}
.sc.back{transform:translateY(10px) scale(.96);pointer-events:none;opacity:.6}
.sc h3{font:400 21px/29px "Libre Caslon Text",Georgia,serif}
.sc .q{border-left:1px solid var(--gold);padding:2px 0 2px 12px;font-family:"Libre Caslon Text",Georgia,serif;font-size:15px;line-height:23px}
.flagt{align-self:flex-start;border:1px solid var(--gold);color:var(--gold);font:500 12px Jost;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px}
.stamp{position:absolute;top:24px;font:500 14px Jost;letter-spacing:.2em;padding:4px 10px;border:1px solid;opacity:0;background:var(--white)}
.s-yes{right:24px;color:var(--blue);border-color:var(--blue)}.s-no{left:24px;color:var(--slate);border-color:var(--slate)}
.acts{display:flex;justify-content:center;gap:14px}
.rb{width:58px;height:58px;border:1px solid var(--blue);background:var(--white);color:var(--blue);font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.rb.yes{background:var(--blue);color:var(--ivory)}.rb.no{border-color:var(--slate);color:var(--slate)}.rb.may{border-color:var(--gold);color:var(--gold)}
.rb.sm{width:46px;height:46px;font-size:18px;align-self:center;border-color:var(--line);color:var(--slate)}
.hint{text-align:center;font-size:13px;color:var(--slate)}
/* article (blog view) */
.page{background:var(--white);border:1px solid var(--line)}
.cover{height:190px;background:var(--blue);display:flex;align-items:flex-end;padding:14px 18px;color:var(--ivory)}
.cover small{font:400 13px/20px Jost;opacity:.85}
.pg{padding:26px 22px 30px}
.pg .meta{font-size:13px;color:var(--slate);margin:10px 0 18px;padding-bottom:16px;border-bottom:1px solid var(--gold)}
.pg h1{font-size:27px;line-height:34px}
.pg h2{font-size:20px;line-height:28px;margin:26px 0 8px}
.pg p{margin:0 0 14px;color:var(--blue)}
.pg p.lead{font-family:"Libre Caslon Text",Georgia,serif;font-size:17px;line-height:28px}
.pg .src{font-size:14px;color:var(--slate)}.pg .src a{color:var(--blue)}
.fx{border-bottom:1px solid var(--gold);cursor:pointer}
.fx.on{background-color:var(--ivory)}
.fx sup{display:inline-flex;width:16px;height:16px;align-items:center;justify-content:center;border:1px solid var(--gold);color:var(--gold);font:500 10px Jost;margin-left:3px;vertical-align:3px}
.fx.ok sup{background:var(--blue);border-color:var(--blue);color:var(--ivory)}
.fx.bad sup{background:var(--gold);border-color:var(--gold);color:var(--white)}
.vf{background:var(--ivory);padding:0 3px;font-weight:500}
.cta{border:1px solid var(--blue);padding:12px;text-align:center;font-weight:500;margin-top:20px}
.edit{outline:1px dashed var(--gold);outline-offset:4px}
/* fact */
.fact{background:var(--white);border:1px solid var(--line);border-top:2px solid var(--blue);padding:22px;display:flex;flex-direction:column;gap:14px}
.fact .t{font:400 18px/27px "Libre Caslon Text",Georgia,serif}
.ctxp{font-size:14px;line-height:22px;color:var(--slate);border-left:1px solid var(--gold);padding-left:12px}
.fact a{color:var(--blue)}
.warn{border:1px solid var(--gold);padding:10px 12px;font-size:14px;line-height:22px}
.warn b{color:var(--gold);letter-spacing:.1em}
textarea{width:100%;min-height:92px;border:1px solid var(--line);padding:12px;font:400 15px/23px Jost,Arial;resize:vertical;background:var(--white);color:var(--blue)}
textarea:focus,input:focus,select:focus{outline:1px solid var(--blue)}
input[type=url],input[type=text],select{width:100%;border:1px solid var(--line);padding:12px;font:400 15px Jost,Arial;background:var(--white);color:var(--blue)}
.fld{display:flex;flex-direction:column;gap:6px}
.list{display:flex;flex-direction:column;gap:8px}
.li{background:var(--white);border:1px solid var(--line);padding:12px 14px;font-size:14px;line-height:22px;display:flex;gap:10px}
.sq{width:10px;height:10px;flex:none;margin-top:6px}
.sheet{position:fixed;inset:0;background:rgba(18,35,63,.5);display:none;align-items:flex-end;justify-content:center;z-index:9}
.sheet.on{display:flex}
.sheet .in{background:var(--paper);width:100%;max-width:480px;padding:22px 20px;display:flex;flex-direction:column;gap:12px;border-top:2px solid var(--gold)}
.done{text-align:center;padding:24px 6px;display:flex;flex-direction:column;gap:12px;align-items:center}
footer{padding:16px 20px 26px;font-size:12px;color:var(--slate);text-align:center;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div class="app">
<header>
<div class="logo" aria-label="HBB Harbor Beyond Borders"><span class="mono">HBB</span><span class="nm"><b id="lgN">HARBOR</b><i id="lgD">BEYOND BORDERS</i></span></div>
<div class="ctx"><div class="lbl" id="roleL">Revisão</div><button class="navb" id="homeBtn" hidden>Início</button></div>
</header>
<main id="v"></main>
<footer>Protótipo de uso interno · textos e factos de exemplo, não verificados</footer>
</div>
<div class="sheet" id="sheet"><div class="in" id="shIn"></div></div>
<script>
const GOAL=40; // objetivo mensal da equipa (artigos aprovados)
const WA_RUI="351000000000"; // número do Rui (formato internacional, sem +)
const AREAS={IM:"Imigração e Nacionalidade",CT:"Contratos",LB:"Direito Laboral",CM:"Comercial e Empresas",IB:"Real Estate",RG:"RGPD e Compliance",FORA:"Fora das 6 áreas"};
const ROLES={a1:{name:"Advogada 1",areas:["IM","CM","FORA"]},a2:{name:"Advogada 2",areas:["CT","LB","CM","IB","RG","FORA"]}};
const TOPICS=[
{id:"110",ar:"FORA",pub:"Pessoas que se mudam",t:"IFICI: quem pode ter o regime fiscal para novos residentes",q:"Ainda há algum regime fiscal especial para quem se muda para Portugal?",a:"Quem pode pedir, até quando e o que fazer antes de chegar.",w:"Fiscal · estava no 1.º lote"},
{id:"153",ar:"FORA",pub:"Pessoas que se mudam",t:"Herança em Portugal para estrangeiros: a legítima",q:"Posso deixar tudo ao meu cônjuge se viver em Portugal?",a:"Como funciona a legítima e a escolha da lei do país de origem.",w:"Sucessões · estava no 1.º lote"},
{id:"95",ar:"IM",pub:"Pessoas que se mudam",t:"Nacionalidade portuguesa em 2026: a nova regra dos 10 anos",q:"Tenho residência há 4 anos. Quando posso pedir a nacionalidade?",a:"Os novos prazos, quem tem 7 anos e como se conta o tempo."},
{id:"108",ar:"IM",pub:"Pessoas que se mudam",t:"Pedidos de nacionalidade entregues antes de maio de 2026: que regras se aplicam?",q:"Entreguei o pedido em abril. A lei nova aplica-se a mim?",a:"O regime transitório e o que fazer se o pedido estiver parado."},
{id:"1",ar:"IM",pub:"Pessoas que se mudam",t:"Golden Visa em 2026: as vias de investimento que ainda contam",q:"Ainda dá para ter Golden Visa comprando casa?",a:"As vias em vigor, os montantes e o que acabou em 2023."},
{id:"237",ar:"IM",pub:"Pessoas que se mudam",t:"Inscrever os filhos na escola antes de ter a autorização de residência",q:"Os meus filhos podem começar as aulas antes do cartão de residência?",a:"O que a escola pode pedir e que documentos levar."},
{id:"N30",ar:"CM",pub:"Empresas",t:"Registo do beneficiário efetivo (RCBE): quem tem de o fazer e quando",q:"Abri uma Lda com um sócio estrangeiro. Temos de declarar alguma coisa?",a:"Quem é beneficiário efetivo, prazos e o que acontece se faltar."},
{id:"57",ar:"CM",pub:"Empresas",t:"Criar uma empresa em Portugal: Lda ou SA?",q:"Que tipo de sociedade faz sentido para uma startup com investidores?",a:"Diferenças de capital, gestão, sócios e custos de constituição."},
{id:"N1",ar:"LB",pub:"Empresas",t:"Reforma laboral Trabalho XXI: o que muda para os empregadores",q:"O que tenho de mudar nos contratos com a nova lei laboral?",a:"O que já está em vigor, o que ainda é proposta e o que rever."},
{id:"N2",ar:"LB",pub:"Empresas",t:"Contratar um trabalhador de fora da UE: os passos do empregador",q:"Quero contratar um engenheiro do Brasil. Por onde começo?",a:"Visto certo, documentos da empresa, prazos e obrigações."},
{id:"N37",ar:"RG",pub:"Empresas",t:"RGPD para pequenas empresas: a lista mínima",q:"Tenho oito funcionários. O que preciso mesmo de ter em RGPD?",a:"Registo de tratamentos, avisos, contratos com fornecedores e violações de dados."},
{id:"N44",ar:"RG",pub:"Empresas",t:"Canal de denúncias: que empresas têm de o ter",q:"A minha empresa tem 60 trabalhadores. Preciso de um canal de denúncias?",a:"Quem está obrigado, como montar o canal e prazos de resposta."},
{id:"N22",ar:"CT",pub:"Empresas",t:"Contratos comerciais em Portugal: o essencial para empresas estrangeiras",q:"O contrato pode ficar sujeito à lei inglesa?",a:"Lei aplicável, foro, cláusulas obrigatórias e erros comuns."},
{id:"139",ar:"IB",pub:"Pessoas que se mudam",t:"Contrato-promessa de compra e venda (CPCV): o que verificar antes de assinar",q:"Vou assinar o CPCV amanhã. O que devo confirmar?",a:"Sinal, prazos, condições e o que acontece se alguém desistir."}
];
const D8={id:"IM-041",ar:"IM",pub:"Pessoas que se mudam",title:"Visto D8 (nómada digital): que rendimento é preciso em 2026?",img:"Tejo ao fim da tarde, vista de Alfama",
facts:[
{t:"O rendimento mínimo para o visto D8 é de 4 vezes o salário mínimo nacional.",src:"Lei n.º 23/2007 (Lei de Estrangeiros), versão atualizada",url:"https://diariodarepublica.pt"},
{t:"Em 2026, isso corresponde a 3.680 € por mês.",src:"Diploma que fixa o salário mínimo nacional para 2026",url:"https://diariodarepublica.pt",flag:"Confirmar se o valor de referência é o do ano do pedido."},
{t:"O rendimento tem de vir de trabalho prestado à distância para entidades ou clientes fora de Portugal.",src:"Lei n.º 23/2007, regime da atividade profissional prestada à distância",url:"https://diariodarepublica.pt"},
{t:"Há duas modalidades: visto de estada temporária, até um ano, e visto de residência.",src:"Portal Vistos — Ministério dos Negócios Estrangeiros",url:"https://vistos.mne.gov.pt"},
{t:"Depois de entrar com o visto de residência, a autorização de residência é pedida à AIMA.",src:"AIMA — autorizações de residência",url:"https://aima.gov.pt"}],
body:()=>`<p class="lead">Quem trabalha à distância para uma empresa ou para clientes de fora de Portugal pode viver no país com o visto D8, conhecido como visto de nómada digital. A pergunta que mais se ouve é quanto é preciso ganhar. <span class="fx" data-f="0">O rendimento mínimo corresponde a quatro vezes o salário mínimo nacional<sup>1</sup></span>, o que em 2026 dá <span class="fx" data-f="1">3.680 € por mês<sup>2</sup></span>.</p>
<p>Este valor muda todos os anos, porque acompanha o salário mínimo. Por isso, quem prepara o pedido no fim do ano deve confirmar qual é o valor que o consulado vai aplicar no dia da entrega. <span class="vf">[VERIFICAR]</span></p>
<h2>Que rendimento conta para o visto D8?</h2>
<p>Conta o rendimento de trabalho feito à distância. <span class="fx" data-f="2">Tem de vir de empregadores ou clientes fora de Portugal<sup>3</sup></span>: um salário pago por uma empresa estrangeira ou a faturação a clientes de outros países. O consulado pede, em regra, os contratos e os extratos bancários dos últimos meses, para ver que o rendimento é regular.</p>
<h2>Estada temporária ou residência: qual escolher?</h2>
<p><span class="fx" data-f="3">Há duas modalidades: o visto de estada temporária, que permite ficar até um ano, e o visto de residência<sup>4</sup></span>. A primeira serve para quem quer experimentar viver em Portugal. A segunda é para quem quer ficar, porque abre caminho à autorização de residência.</p>
<h2>O que acontece depois de chegar?</h2>
<p><span class="fx" data-f="4">Com o visto de residência, a autorização de residência é pedida à AIMA<sup>5</sup></span>, a Agência para a Integração, Migrações e Asilo, que trata dos títulos de residência em Portugal.</p>
<h2>Erros comuns</h2>
<p>Apresentar rendimento de clientes portugueses, juntar extratos que não mostram pagamentos regulares, ou fazer as contas com o salário mínimo do ano anterior.</p>`};
const FT={id:"LB-012",ar:"LB",pub:"Empresas",title:"Contrato a termo: quando é que a lei o permite?",q:"Posso contratar a prazo só para experimentar a pessoa?",a:"Os motivos que a lei aceita, a duração máxima e o que acontece se o motivo não for válido."};
function tplArt(t){return{id:t.id,ar:t.ar,pub:t.pub,title:t.t||t.title,img:"Fachada de azulejo em Lisboa",tpl:true,
facts:[{t:"Exemplo de facto 1: o requisito principal, com número ou prazo.",src:"Diploma aplicável no Diário da República",url:"https://diariodarepublica.pt"},
{t:"Exemplo de facto 2: o prazo ou a consequência legal.",src:"Página oficial da entidade competente",url:"https://eportugal.gov.pt"}],
body:()=>`<p class="lead">Texto de exemplo. Na versão real, o Claude escreve aqui uma introdução de dois ou três parágrafos que responde logo à pergunta, com base nas fontes oficiais. Este artigo trata de ${esc((t.a||'').toLowerCase())}</p>
<p>Uma empresa ou uma pessoa que se pergunta «${esc(t.q||'')}» encontra aqui a resposta direta, os passos e o que preparar. <span class="fx" data-f="0">Aqui ficaria o primeiro facto com fonte<sup>1</sup></span>.</p>
<h2>${esc(t.q||'')}</h2>
<p>Explicação em texto corrido, com os termos jurídicos explicados na primeira vez. <span class="fx" data-f="1">Aqui ficaria o segundo facto com fonte<sup>2</sup></span>.</p>
<h2>Erros comuns</h2><p>Os erros mais frequentes, escritos em linguagem simples.</p>`}}
const BASE={a1:[D8],a2:[tplArt(FT)]};
const fresh=()=>({day:0,dec:{},notes:{},hist:[],queued:{},arts:{},sug:[]});
let S={role:null,r:{a1:fresh(),a2:fresh()}};
try{const s=JSON.parse(localStorage.getItem('hbbrev4')||'null');if(s)S=s}catch(e){}
function save(){try{localStorage.setItem('hbbrev4',JSON.stringify(S))}catch(e){}}
const v=document.getElementById('v'),hb=document.getElementById('homeBtn'),sheet=document.getElementById('sheet'),shIn=document.getElementById('shIn'),roleL=document.getElementById('roleL');
hb.onclick=()=>v.dataset.s==='home'?login():home();
function sub(){hb.hidden=false;hb.textContent='Início';v.dataset.s=''}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fitLogo(){const n=document.getElementById('lgN'),d=document.getElementById('lgD');d.style.letterSpacing='0px';const w=n.getBoundingClientRect().width,c=d.textContent.length,dw=d.getBoundingClientRect().width;d.style.letterSpacing=Math.max(0,(w-dw)/(c-1))+'px';d.style.marginRight='-'+d.style.letterSpacing}
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(fitLogo);
function closeSheet(){sheet.classList.remove('on')}
sheet.onclick=e=>{if(e.target===sheet)closeSheet()};
const R=()=>S.r[S.role], other=()=>S.r[S.role==='a1'?'a2':'a1'];
/* ---------- login ---------- */
function login(){S.role=null;save();hb.hidden=true;roleL.textContent='Revisão';
v.innerHTML=`<div class="lbl">Protótipo</div><h1>Quem está a entrar?</h1><hr class="rule">
<p class="sec">Na versão real cada advogada entra com o email da firma e vê só as suas áreas. Aqui pode experimentar as duas.</p>
${Object.entries(ROLES).map(([k,r])=>`<button class="tile" data-r="${k}"><span class="num f">${k==='a1'?1:2}</span><span><b>${r.name}</b><span class="sec">${r.areas.filter(a=>a!=='FORA').map(a=>AREAS[a]).join(' · ')}</span></span></button>`).join('')}
<button class="btn q" id="rst" style="margin-top:auto">Recomeçar o protótipo</button>`;
v.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{S.role=b.dataset.r;save();home()});
rst.onclick=()=>{S={role:null,r:{a1:fresh(),a2:fresh()}};save();login()};}
/* ---------- data helpers ---------- */
const myTopics=()=>TOPICS.filter(t=>ROLES[S.role].areas.includes(t.ar));
const takenByOther=t=>t.ar==='CM'&&['sim','mas'].includes(other().dec[t.id]);
const pending=()=>myTopics().filter(t=>!R().dec[t.id]&&!takenByOther(t));
function myArts(){const r=R(),list=BASE[S.role].map(a=>({a,ready:0}));
myTopics().forEach(t=>{if(r.queued[t.id]!==undefined)list.push({a:tplArt(t),ready:r.queued[t.id]+1})});(r.sug||[]).forEach(t=>list.push({a:tplArt(t),ready:t.day+1}));return list}
function st(id){const r=R();return r.arts[id]||(r.arts[id]={fx:{},fxn:{},status:'review',v:1,edited:null,read:false,at:0})}
function status(x){const r=R(),s=st(x.a.id);if(r.day<x.ready)return'writing';if(['fixing','rewriting'].includes(s.status)&&r.day>s.at){s.status='review';s.v++;s.read=false;if(s.rw){s.fx={};s.fxn={};s.edited=null;s.rw=0}else{Object.keys(s.fxn).forEach(k=>{delete s.fx[k];delete s.fxn[k]})}save()}return s.status}
const LAB={writing:['Em escrita','Chega amanhã de manhã','var(--line)'],review:['Para rever','','var(--blue)'],fixing:['Com o Claude','Volta amanhã de manhã','var(--gold)'],rewriting:['A ser reescrito','Volta amanhã de manhã','var(--gold)'],final:['Versão final','Segue para tradução e publicação','var(--slate)']};
function sim24(back){R().day++;save();back()}
function finals(k){return Object.values(S.r[k].arts).filter(s=>s.status==='final').length}
function goalBox(){const a=finals('a1'),b=finals('a2'),t=a+b,pc=Math.min(100,t/GOAL*100),me=S.role;
const row=(k,n)=>`<div class="row" style="align-items:center;gap:10px"><span style="flex:none;width:150px;font-size:14px;${k===me?'font-weight:500':''}">${ROLES[k].name}${k===me?' (você)':''}</span><div class="bar" style="height:6px"><i style="width:${GOAL?n/GOAL*100:0}%;background:${k==='a1'?'var(--blue)':'var(--gold)'}"></i></div><span style="flex:none;width:28px;text-align:right;font-weight:500">${n}</span></div>`;
return `<div class="page" style="padding:18px;display:flex;flex-direction:column;gap:10px">
